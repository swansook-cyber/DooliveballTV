name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master, 'feature/vela-sport-tv-remote-v13']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: |
          echo "Android SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Vela Sport PNG artwork
        run: |
          python3 -m venv /tmp/vela-png-env
          /tmp/vela-png-env/bin/python -m pip install --quiet cairosvg
          /tmp/vela-png-env/bin/python - <<'PY'
          import cairosvg
          from pathlib import Path
          out = Path('app/src/main/res/drawable')
          out.mkdir(parents=True, exist_ok=True)
          cairosvg.svg2png(url='assets/vela-sport-icon.svg', write_to=str(out/'vela_sport_icon.png'), output_width=432, output_height=432)
          cairosvg.svg2png(url='assets/vela-sport-banner.svg', write_to=str(out/'vela_sport_banner.png'), output_width=640, output_height=360)
          print('PNG launcher assets generated')
          PY
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: VelaSport-v1.3.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
