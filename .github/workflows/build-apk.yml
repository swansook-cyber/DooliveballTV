name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: ['**']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/tv_navigation.test.js
      - name: Verify original Vela Sport artwork
        run: |
          echo '5aa55493ff9abca4be16375b108c9c1312bff1834c015ab9efe9ee88c31b441f  assets/vela-sport-original.png' | sha256sum -c -
          cmp assets/vela-sport-original.png app/src/main/res/drawable/vela_sport_icon.png
      - name: Install Android SDK packages
        run: |
          echo "Android SDK: $ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug :app:lint --no-daemon
      - name: Verify APK identity and signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/vela-badging.txt
          grep -q "package: name='net.velalab.dooliveballtv' versionCode='5' versionName='1.3.1'" /tmp/vela-badging.txt
          grep -q "application-label:'Vela Sport'" /tmp/vela-badging.txt
          unzip -p "$APK" res/drawable/vela_sport_icon.png | sha256sum | grep -q '^5aa55493ff9abca4be16375b108c9c1312bff1834c015ab9efe9ee88c31b441f '
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: VelaSport-v1.3.1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
